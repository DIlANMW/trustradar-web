<!DOCTYPE html>
<html lang="en">

<head>
  <!-- BASIC -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- TITLE (VERY IMPORTANT) -->
  <title>TrustRadar – Detect Fake Amazon Reviews Instantly</title>

  <!-- META DESCRIPTION -->
  <meta name="description"
    content="TrustRadar is a free Chrome extension that analyzes Amazon reviews in real time to detect fake, manipulated, and biased reviews so you can buy with confidence." />

  <!-- KEYWORDS (optional but fine) -->
  <meta name="keywords"
    content="Amazon fake reviews, Amazon review analyzer, Chrome extension Amazon reviews, detect fake reviews, TrustRadar" />

  <!-- SEO CONTROL -->
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://trustradar.app/" />

  <!-- OPEN GRAPH (Google + WhatsApp + LinkedIn) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="TrustRadar – Detect Fake Amazon Reviews Instantly" />
  <meta property="og:description"
    content="Analyze Amazon reviews instantly with AI-powered trust scores, fake review detection, and smart buy recommendations." />
  <meta property="og:url" content="https://trustradar.app/" />
  <meta property="og:image" content="https://trustradar.app/og.png" />

  <!-- TWITTER / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="TrustRadar – Detect Fake Amazon Reviews Instantly" />
  <meta name="twitter:description"
    content="A free Chrome extension that detects fake Amazon reviews and helps you make confident buying decisions." />
  <meta name="twitter:image" content="https://trustradar.app/og-image.png" />

  <!-- FONTS -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap"
    rel="stylesheet" />

  <!-- STRUCTURED DATA (PRODUCT / EXTENSION) -->
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "TrustRadar",
        "applicationCategory": "BrowserExtension",
        "operatingSystem": "Chrome",
        "description": "TrustRadar analyzes Amazon reviews to detect fake, manipulated, and biased reviews in real time.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
</head>

<body class="bg-slate-950 text-white">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
